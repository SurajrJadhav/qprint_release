org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 16 KB page size (Google Play): keep native libs uncompressed so alignment is preserved.
android.bundle.enableNativeLibraryCompression=false

# Disable Kotlin incremental compilation to avoid "different roots" error when project is on
# a different drive (e.g. G:) than Pub cache (C:) — avoids RelocatableFileToPathConverter failures.
kotlin.incremental=false

# Reduce timeouts during dependency resolution / network
org.gradle.daemon=true
org.gradle.parallel=true
# Increase timeouts (milliseconds) for slow networks or busy machines
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.paging.maxWorkers=4
